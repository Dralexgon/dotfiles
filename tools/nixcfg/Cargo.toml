[package]
name = "nixcfg"
version = "2.0.0"
edition = "2024"
description = "TUI to toggle the modules and packages of the NixOS hosts in ~/dotfiles"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.28"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
unicode-width = "0.2"

[profile.release]
strip = true
lto = "thin"
panic = "abort"
